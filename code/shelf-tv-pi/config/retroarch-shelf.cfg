# Shelf's RetroArch settings. They're applied on top of RetroArch's own every time a game starts.

# let the Home button watcher tell RetroArch to quit
network_cmd_enable = "true"
network_cmd_port = "55355"
quit_press_twice = "false"

# save when quitting, and load that save next time (Shelf copies the right one in first)
savestate_auto_save = "true"
savestate_auto_load = "true"
savestate_thumbnail_enable = "true"

# keep saves exactly where Shelf puts them
sort_savefiles_enable = "false"
sort_savestates_enable = "false"
sort_savefiles_by_content_enable = "false"
sort_savestates_by_content_enable = "false"
savefiles_in_content_dir = "false"
savestates_in_content_dir = "false"

# don't write these settings back into RetroArch's own file
config_save_on_exit = "false"

video_fullscreen = "true"
input_autodetect_enable = "true"
