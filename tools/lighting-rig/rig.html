<div style="position:relative;width:1334px;height:750px"><canvas id=bg width=1334 height=750></canvas><canvas id=c width=1334 height=750 style="position:absolute;left:0;top:0"></canvas></div>

  } else if (SCENE === 'cases') {

    const cx = what === 'box' ? 520 : 560, cy = what === 'box' ? 390 : 400, hw = what === 'box' ? 300 : 230, hh = what === 'box' ? 300 : 170;
