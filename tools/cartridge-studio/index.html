<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cartridge Studio</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d0f14; --panel: #161921; --line: #2a2e3a; --fg: #eceef4; --fg2: #9aa0b3; --accent: #b3a6ff;
  font-family: system-ui, "Segoe UI", sans-serif;
}
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--fg); }
body { display: grid; grid-template-columns: 1fr 320px; }
#view { position: relative; min-height: 60vh; background: radial-gradient(ellipse at 50% 40%, #2a2e3a 0, #12141b 70%); }
#view canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
aside { background: var(--panel); border-left: 1px solid var(--line); padding: 20px 20px 28px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; }
h1 { margin: 0; font-size: 18px; font-weight: 650; }
p.lead { margin: -8px 0 0; font-size: 13px; color: var(--fg2); line-height: 1.45; }
h2 { margin: 6px 0 0; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg2); }
.row { display: grid; grid-template-columns: 1fr 64px; grid-template-rows: auto auto; gap: 4px 10px; font-size: 13px; }
.row span { grid-column: 1 / -1; color: var(--fg2); }
.row input[type=range] { width: 100%; accent-color: var(--accent); }
.row output { font-variant-numeric: tabular-nums; text-align: right; }
select, button, .file { font: inherit; font-size: 14px; color: var(--fg); background: #1f2330; border: 1px solid var(--line); border-radius: 10px; padding: 9px 12px; }
button { cursor: pointer; } button.primary { background: var(--accent); color: #12101e; border-color: var(--accent); font-weight: 650; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.line { display: flex; gap: 10px; align-items: center; font-size: 13px; color: var(--fg2); }
.line input[type=color] { width: 44px; height: 30px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: none; }
.file { display: block; font-size: 13px; color: var(--fg2); }
.file input { display: block; margin-top: 6px; color: var(--fg); font-size: 12px; max-width: 100%; }
.buttons { display: flex; gap: 10px; flex-wrap: wrap; }
[hidden] { display: none !important; }
#note, #envLine { font-size: 12px; color: var(--fg2); min-height: 1em; }
textarea { width: 100%; box-sizing: border-box; min-height: 70px; font: 12px ui-monospace, monospace; color: var(--fg); background: #0f1117; border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
@media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: 58vh auto; } aside { border-left: 0; border-top: 1px solid var(--line); padding-inline: 16px; } }
@media (prefers-reduced-motion: reduce) { #turntableLine { opacity: .7; } }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<main id="view"></main>
<aside>
  <h1>Cartridge Studio</h1>
  <p class="lead">Shelf’s cartridges and consoles, built from <code>cartridges.js</code> and <code>consoles.js</code>. Drag to turn, scroll to zoom.</p>
  <select id="style" aria-label="Cartridge or console"></select>
  <h2>Shape</h2>
  <div id="sliders"></div>
  <h2>Plastic</h2>
  <div class="line"><input type="color" id="color" aria-label="Plastic color"> Plastic color</div>
  <label class="line" id="turntableLine"><input type="checkbox" id="turntable"> Turntable</label>
  <label class="file" id="labelLine">Label art (optional)<input type="file" id="labelFile" accept="image/*"></label>
  <label class="file">Environment HDR or EXR (optional)<input type="file" id="envFile" accept=".hdr,.exr"></label>
  <div id="envLine">Environment: <span id="envName">loading…</span></div>
  <div class="buttons">
    <button class="primary" id="export">Export .glb</button>
    <button id="copy">Copy settings</button>
    <button id="reset">Reset</button>
  </div>
  <textarea id="settingsText" hidden aria-label="Tuned settings"></textarea>
  <div id="note" role="status"></div>
</aside>
<script type="module" src="./studio.js"></script>
</body>
</html>
