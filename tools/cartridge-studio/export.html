<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartridge Studio export</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<p>Exports every cartridge and console for the Android app. Run <code>node export-models.mjs</code>; see the README.</p>
<script type="module">
// Builds each model with the Studio's default settings and hands back .glb files (as base64) for export-models.mjs to
// save. Cartridges come in their standard plastic, plus a see-through version (with the circuit board inside);
// the app recolors them per game. The label carries a tiny placeholder picture, so its material keeps a texture slot
// the app fills with the game's own label.
import * as THREE from 'three';
import { mergeGeometries, mergeVertices } from 'three/addons/utils/BufferGeometryUtils.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { STYLES } from './cartridges.js';
import { CONSOLES, CONSOLE_COLORS, PART_NAMES } from './consoles.js';
import { buildCartridge, applyVariant, fontReady } from './cartridge.js';
import { buildConsole, splitHalves } from './console.js';
import { buildBoard, placeBoard, BOARDS, MASK } from './board.js';
import { buildCase, CASES } from './case.js';

const DEFAULTS = { bevel: .8, segments: 6, round: 1, envIntensity: 1 };
const placeholder = () => { const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 8, 8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const glb = obj => new Promise((res, rej) => new GLTFExporter().parse(obj, buf => {
  let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); res(btoa(s)); }, rej, { binary: true }));

// One mesh per material. A cartridge is built from dozens of parts (walls, ridges, each gold contact, each screw's
// pieces); drawn separately they cost the phone's graphics chip a draw call each, every frame. Merged by material they
// look the same and cost a handful. Names the app looks for: the plastic is "body", the label "label", the board's
// printed face "pcb" (its material keeps the name pcb-print). Only what's visible goes in, as before.
function mergeByMaterial(root, names = {}) {
  root.updateMatrixWorld(true);
  const toRoot = new THREE.Matrix4().copy(root.matrixWorld).invert(), buckets = new Map();
  const take = (g, mat) => {   // the same attributes on every piece: position, normal, uv
    const out = new THREE.BufferGeometry();
    for (const a of ['position', 'normal']) out.setAttribute(a, g.getAttribute(a));
    out.setAttribute('uv', g.getAttribute('uv') || new THREE.BufferAttribute(new Float32Array(g.getAttribute('position').count * 2), 2));
    if (!buckets.has(mat)) buckets.set(mat, []); buckets.get(mat).push(out);
  };
  root.traverseVisible(o => {
    if (!o.isMesh) return;
    const g = (o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone()).applyMatrix4(new THREE.Matrix4().multiplyMatrices(toRoot, o.matrixWorld));
    if (!Array.isArray(o.material)) return take(g, o.material);
    for (const grp of g.groups) {   // a box with a material per face: each face's triangles go with its own material
      const part = new THREE.BufferGeometry();
      for (const a of ['position', 'normal', 'uv']) { const s = g.getAttribute(a); if (s) part.setAttribute(a, new THREE.BufferAttribute(s.array.slice(grp.start * s.itemSize, (grp.start + grp.count) * s.itemSize), s.itemSize)); }
      take(part, o.material[grp.materialIndex]);
    }
  });
  const out = new THREE.Group(); out.name = root.name;
  // points shared again after merging, so the files stay small
  for (const [mat, geos] of buckets) { const m = new THREE.Mesh(mergeVertices(mergeGeometries(geos), 1e-4), mat); m.name = names.get?.(mat) || mat.name || 'part'; out.add(m); }
  return out;
}
const cartNames = c => new Map([[c.userData.materials.plastic, 'body'], [c.userData.materials.label, 'label'], ...[...findMaterial(c, 'pcb-print')].map(m => [m, 'pcb'])]);
const findMaterial = (root, name) => { const s = new Set(); root.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => { if (m.name === name) s.add(m); }); }); return s; };

// each console's case color: the real cases' where they were plastic, otherwise one quiet grey for all (boxes stay plain)
const CASE_COLORS = { genesis: ['#17181d', '#101114'], ps1: ['#24262e', '#16171c'], ds: ['#d9dce4', '#c4c8d2'], psp: ['#1f2128', '#15161b'], android: ['#262b3a', '#1b1f2b'] };

window.exportAll = async ({ consoles = false, cases = false, carts = true } = {}) => {
  const files = {}, variants = {}, consoleInfo = {};
  await fontReady;   // the circuit boards' print uses Orbitron
  for (const [id, style] of Object.entries(carts ? STYLES : {})) {
    const tune = { ...DEFAULTS, ...style.finish };
    const cart = buildCartridge(style, { bevel: tune.bevel, segments: tune.segments, finish: tune, labelTexture: placeholder() });
    applyVariant(cart, style.variants[0], tune);
    files[`cart-${id}.glb`] = await glb(mergeByMaterial(cart, cartNames(cart)));
    // every style gets a see-through model: the app's Studio offers clear, frosted and smoke finishes for any cartridge
    const clear = style.variants.find(v => v.clear) || { ...style.variants[0], clear: 'transparent' };
    { const c2 = buildCartridge(style, { bevel: tune.bevel, segments: tune.segments, finish: tune, labelTexture: placeholder() }); applyVariant(c2, clear, tune); files[`cart-${id}-clear.glb`] = await glb(mergeByMaterial(c2, cartNames(c2))); }
    variants[id] = { name: style.name, size: style.size, depth: style.depth, label: style.label, finish: style.finish, variants: style.variants };
  }
  for (const [id, entry] of consoles ? Object.entries(CONSOLES) : []) {
    const tune = { ...DEFAULTS, ...entry.finish };
    const make = () => {
      const con = buildConsole(entry, { round: 1, segments: 6, finish: tune, lid: entry.lid ? entry.lid.rest : 0 });
      for (const m of con.userData.materials.plastics) { m.roughness = tune.roughness; m.clearcoat = tune.clearcoat; m.clearcoatRoughness = tune.clearcoatRoughness; }   // as the Studio's applyLook does
      // a part in two shades (the NES's band, the Genesis's switches) gets a name for each, "role:band#2": the app keeps
      // each one's own color for the schemes that leave that part alone
      const shades = new Map(); for (const m of con.userData.materials.plastics) {
        const k = m.name, look = m.color.getHexString(); if (!shades.has(k)) shades.set(k, []);
        const l = shades.get(k); let i = l.indexOf(look); if (i < 0) { l.push(look); i = l.length - 1; } if (i > 0) m.name = k + '#' + (i + 1); }
      return entry.seam ? splitHalves(con, entry.seam) : con;
    };
    // the two halves stay apart (nodes "lower" and "upper"), each merged by material, so the app can open the upper one
    const halves = con => { if (!entry.seam) return mergeByMaterial(con); const out = new THREE.Group(); out.name = con.name;
      for (const n of ['lower', 'upper']) { const m = mergeByMaterial(con.getObjectByName(n)); m.name = n; out.add(m); } return out; };
    const con = make();
    files[`console-${id}.glb`] = await glb(halves(con));
    // How the Inside view takes it apart, like an exploded drawing: both halves slide straight away from the board along
    // the seam's axis (a home console's top up and its base down, a handheld's front toward you and its back away),
    // in millimetres, scaled to the console's size
    let explode = null;
    if (entry.seam) {
      const sz = new THREE.Box3().setFromObject(con).getSize(new THREE.Vector3()), flat = entry.seam.axis === 'y';
      const W = flat ? Math.max(sz.x, sz.z) : Math.max(sz.x, sz.y);
      explode = { axis: entry.seam.axis, upper: Math.round(W * (flat ? .42 : .55)), lower: Math.round(W * (flat ? .28 : .45)) };
    }
    // a see-through version, for the clear, frosted and smoke finishes: its shell is blended (the app sets how much
    // shows), and the board, exported on its own in the console's own millimetres, sits inside it
    { const c2 = make(); c2.userData.materials.shell.transparent = true; c2.userData.materials.shell.opacity = .4; c2.userData.materials.shell.depthWrite = false;
      files[`console-${id}-clear.glb`] = await glb(halves(c2)); }
    const spec = BOARDS[id];
    // picture slots for the print and the traces, which the app draws
    if (spec) { const holder = new THREE.Group(); holder.add(placeBoard(buildBoard(spec, placeholder(), placeholder()), spec)); files[`board-${id}.glb`] = await glb(mergeByMaterial(holder)); }
    // the parts this console really has, in the app's order, and its real colors
    const roles = new Set(); con.traverse(o => { if (o.isMesh) [].concat(o.material).forEach(m => { if (m.name?.startsWith('role:')) roles.add(m.name.slice(5).split('#')[0]); }); });
    consoleInfo[id] = { name: entry.name, parts: Object.keys(PART_NAMES).filter(r => roles.has(r)).map(r => [r, PART_NAMES[r]]),
      colors: (CONSOLE_COLORS[id] || []).map(([name, note, parts]) => ({ name, note, parts })),
      // its board's print: the part number, the solder mask's color, the board's size (the print's shape)
      board: BOARDS[id] ? { code: BOARDS[id].code, mask: BOARDS[id].mask || MASK, size: BOARDS[id].size } : null, explode };
  }
  for (const [id, style] of Object.entries(cases ? STYLES : {})) {
    if (!CASES[id]) continue;
    const media = style.kind === 'disc' ? [style.radius * 2, style.radius * 2, style.depth] : [style.size[0], style.size[1], style.depth];
    const [color, inner] = CASE_COLORS[id] || ['#2b2f3c', '#1d2029'];
    files[`case-${id}.glb`] = await glb(buildCase(id, media, { color, inner, artTexture: placeholder() }));
  }
  if (consoles) files['consoles.json'] = btoa(unescape(encodeURIComponent(JSON.stringify(consoleInfo, null, 1))));
  if (carts) files['cartridges.json'] = btoa(unescape(encodeURIComponent(JSON.stringify(variants, null, 1))));
  return files;
};
window.ready = true;
</script>
</body>
</html>
