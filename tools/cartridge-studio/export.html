<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cartridge Studio export</title>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js", "three/addons/": "./vendor/jsm/" } }
</script>
</head>
<body>
<p>Exports every cartridge and console for the Android app. Run <code>node export-models.mjs</code>; see the README.</p>
<script type="module">
// Builds each model with the Studio's default settings and hands back .glb files (as base64) for export-models.mjs to
// save. Cartridges come in their standard plastic, plus a see-through version (with the circuit board inside);
// the app recolors them per game. The label carries a tiny placeholder picture, so its material keeps a texture slot
// the app fills with the game's own label.
import * as THREE from 'three';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { STYLES } from './cartridges.js';
import { CONSOLES } from './consoles.js';
import { buildCartridge, applyVariant, fontReady } from './cartridge.js';
import { buildConsole } from './console.js';
import { buildCase, CASES } from './case.js';

const DEFAULTS = { bevel: .8, segments: 6, round: 1, envIntensity: 1 };
const placeholder = () => { const c = document.createElement('canvas'); c.width = c.height = 8; const x = c.getContext('2d'); x.fillStyle = '#808080'; x.fillRect(0, 0, 8, 8);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; };
const glb = obj => new Promise((res, rej) => new GLTFExporter().parse(obj, buf => {
  let s = ''; const b = new Uint8Array(buf); for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); res(btoa(s)); }, rej, { binary: true }));

// each console's case color: the real cases' where they were plastic, otherwise one quiet grey for all (boxes stay plain)
const CASE_COLORS = { genesis: ['#17181d', '#101114'], ps1: ['#24262e', '#16171c'], ds: ['#d9dce4', '#c4c8d2'], psp: ['#1f2128', '#15161b'], android: ['#262b3a', '#1b1f2b'] };

window.exportAll = async ({ consoles = false, cases = false, carts = true } = {}) => {
  const files = {}, variants = {};
  await fontReady;   // the circuit boards' print uses Orbitron
  for (const [id, style] of Object.entries(carts ? STYLES : {})) {
    const tune = { ...DEFAULTS, ...style.finish };
    const cart = buildCartridge(style, { bevel: tune.bevel, segments: tune.segments, finish: tune, labelTexture: placeholder() });
    applyVariant(cart, style.variants[0], tune);
    files[`cart-${id}.glb`] = await glb(cart);
    // every style gets a see-through model: the app's Studio offers clear, frosted and smoke finishes for any cartridge
    const clear = style.variants.find(v => v.clear) || { ...style.variants[0], clear: 'transparent' };
    { const c2 = buildCartridge(style, { bevel: tune.bevel, segments: tune.segments, finish: tune, labelTexture: placeholder() }); applyVariant(c2, clear, tune); files[`cart-${id}-clear.glb`] = await glb(c2); }
    variants[id] = { name: style.name, size: style.size, depth: style.depth, label: style.label, finish: style.finish, variants: style.variants };
  }
  for (const [id, entry] of consoles ? Object.entries(CONSOLES) : []) {
    const tune = { ...DEFAULTS, ...entry.finish };
    const con = buildConsole(entry, { round: 1, segments: 6, finish: tune, lid: entry.lid ? entry.lid.rest : 0 });
    for (const m of con.userData.materials.plastics) { m.roughness = tune.roughness; m.clearcoat = tune.clearcoat; m.clearcoatRoughness = tune.clearcoatRoughness; }   // as the Studio's applyLook does
    files[`console-${id}.glb`] = await glb(con);
  }
  for (const [id, style] of Object.entries(cases ? STYLES : {})) {
    if (!CASES[id]) continue;
    const media = style.kind === 'disc' ? [style.radius * 2, style.radius * 2, style.depth] : [style.size[0], style.size[1], style.depth];
    const [color, inner] = CASE_COLORS[id] || ['#2b2f3c', '#1d2029'];
    files[`case-${id}.glb`] = await glb(buildCase(id, media, { color, inner, artTexture: placeholder() }));
  }
  if (carts) files['cartridges.json'] = btoa(unescape(encodeURIComponent(JSON.stringify(variants, null, 1))));
  return files;
};
window.ready = true;
</script>
</body>
</html>
