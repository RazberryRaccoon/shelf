# Builds the Shelf Android app (APK). Every push to main also publishes it as the newest release, so the
# latest APK is always at https://github.com/RazberryRaccoon/shelf/releases/latest/download/Shelf.apk
name: Android app

on:
  push:
    branches: [main, work-in-progress]
    paths: ['android/**', 'prototype-source/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'prototype-source/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write   # to publish the release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Put the interface into the app
        run: bash android/prepare-assets.sh

      - name: Build the APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name it Shelf.apk
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Shelf.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Shelf-apk
          path: Shelf.apk

      - name: Publish as the newest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Shelf for Android, build ${{ github.run_number }}
          body: |
            Built from ${{ github.sha }}.
            Download **Shelf.apk** below onto the Retroid Pocket 3+ and open it to install or update.
          files: Shelf.apk
          make_latest: true
